name: Daily Motivational Automation

on:
  schedule:
    # 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
    # 2:00 PM IST (08:30 UTC)
    - cron: '30 8 * * *'
    # 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1 wget unzip fontconfig libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install FFMPEG
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node automate_single.mjs

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update quotes state" && git push)
